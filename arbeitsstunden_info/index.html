<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  const form = document.getElementById('calc-form');
  const trackMonat = document.getElementById('track-monat');
  const monatFields = document.getElementById('monat-fields');
  const trackSozial = document.getElementById('track-sozialabzuege');
  const submitBtn = document.getElementById('submit-btn');
  const errorBox = document.getElementById('error-box');
  const resultEl = document.getElementById('result');
  const resultEmpty = document.getElementById('result-empty');
  const resultBody = document.getElementById('result-body');
  const jsonBlock = document.getElementById('json-block');
  const outJson = document.getElementById('out-json');
  const copyBtn = document.getElementById('copy-json-btn');
  const verlaufBtn = document.getElementById('verlauf-btn');
  const verlaufDatei = document.getElementById('verlauf-datei');
  let lastResult = null;

  trackMonat.addEventListener('change', () => {
    const checked = trackMonat.checked;
    monatFields.hidden = !checked;
    form.monat_soll_stunden.required = checked;
    form.bereits_geleistete_stunden.required = checked;
    if (!checked) {
      form.monat_soll_stunden.value = '';
      form.bereits_geleistete_stunden.value = '';
    }
  });

  function hideError() {
    errorBox.hidden = true;
    errorBox.textContent = '';
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.hidden = false;
  }

  function extractErrorMessage(data) {
    if (typeof data.detail === 'string') return data.detail;
    if (Array.isArray(data.detail)) {
      return data.detail.map((d) => d.msg || JSON.stringify(d)).join('; ');
    }
    return 'Unbekannter Fehler.';
  }

  function formatDatum(iso) {
    const [y, m, d] = iso.split('-');
    return `${d}.${m}.${y}`;
  }

  // Muss mit LOHN_ZUSCHLAG in classes.py übereinstimmen (1.25 = 125%)
  const LOHN_ZUSCHLAG = 1.25;

  function formatWochentag(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    const datum = new Date(y, m - 1, d);
    const name = datum.toLocaleDateString('de-CH', { weekday: 'long' });
    const tag = datum.getDay(); // 0 = Sonntag, 6 = Samstag
    if (tag === 0 || tag === 6) {
      const prozent = Math.round(LOHN_ZUSCHLAG * 100);
      return `${name} (Lohnzuschlag von ${prozent}%)`;
    }
    return name;
  }

  function formatStunden(value) {
    return `${Number(value).toFixed(2)} h`;
  }

  function formatCHF(value) {
    return `CHF ${Number(value).toFixed(2)}`;
  }

  const VERLAUF_SPALTEN = [
    'arbeitgeber', 'datum', 'arbeitszeit_stunden', 'bereits_geleistete_stunden',
    'verbleibende_stunden_monat', 'brutto_verdienst_chf',
    'ahv_iv_eo_abzug', 'alv_abzug', 'netto_verdienst_chf',
  ];

  function csvEscape(wert) {
    const text = String(wert ?? '');
    if (/[",\n]/.test(text)) {
      return `"${text.replace(/"/g, '""')}"`;
    }
    return text;
  }

  function sammleVerlaufWerte() {
    const ergebnis = lastResult || {};
    return {
      arbeitgeber: form.arbeitgeber.value,
      datum: ergebnis.datum,
      arbeitszeit_stunden: ergebnis.arbeitszeit_stunden,
      bereits_geleistete_stunden: trackMonat.checked ? Number(form.bereits_geleistete_stunden.value) : '',
      verbleibende_stunden_monat: ergebnis.verbleibende_stunden_monat,
      brutto_verdienst_chf: ergebnis.brutto_verdienst_chf,
      ahv_iv_eo_abzug: ergebnis.ahv_iv_eo_abzug,
      alv_abzug: ergebnis.alv_abzug,
      netto_verdienst_chf: ergebnis.netto_verdienst_chf,
    };
  }

  async function verlaufErgaenzenUndHerunterladen(datei, spalten, werte) {
    const istExcel = datei && datei.name.toLowerCase().endsWith('.xlsx');

    if (istExcel) {
      const buffer = await datei.arrayBuffer();
      const workbook = XLSX.read(buffer, { type: 'array' });
      const blattName = workbook.SheetNames[0];
      const blatt = workbook.Sheets[blattName];
      const zeilen = XLSX.utils.sheet_to_json(blatt, { header: 1, defval: '' });

      // Excel merkt sich oft einen grösseren "benutzten Bereich" als die echten Daten –
      // leere Zeilen am Ende abschneiden, damit die neue Zeile direkt nach den echten Daten landet
      while (
        zeilen.length > 0 &&
        zeilen[zeilen.length - 1].every((zelle) => zelle === '' || zelle === undefined || zelle === null)
      ) {
        zeilen.pop();
      }

      zeilen.push(spalten.map((spalte) => werte[spalte] ?? ''));

      const neuesBlatt = XLSX.utils.aoa_to_sheet(zeilen);
      const neuesWorkbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(neuesWorkbook, neuesBlatt, blattName || 'Verlauf');
      XLSX.writeFile(neuesWorkbook, datei.name);
      return;
    }

    const neueZeile = spalten.map((spalte) => csvEscape(werte[spalte])).join(',');
    if (datei) {
      const reader = new FileReader();
      reader.onload = () => {
        let inhalt = reader.result.replace(/\r\n/g, '\n').trimEnd();
        inhalt += '\n' + neueZeile + '\n';
        ladeCsvHerunter(inhalt, datei.name);
      };
      reader.readAsText(datei);
    } else {
      const kopfzeile = spalten.join(',');
      ladeCsvHerunter(kopfzeile + '\n' + neueZeile + '\n', 'verlauf.csv');
    }
  }

  function ladeCsvHerunter(inhalt, dateiname = 'verlauf.csv') {
    const blob = new Blob([inhalt], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = dateiname;
    link.click();
    URL.revokeObjectURL(url);
  }

  function renderResult(data) {
    lastResult = data;
    document.getElementById('out-arbeitgeber').textContent = data.arbeitgeber;
    document.getElementById('out-datum').textContent = formatDatum(data.datum);
    document.getElementById('out-wochentag').textContent = formatWochentag(data.datum);
    document.getElementById('out-arbeitszeit').textContent = formatStunden(data.arbeitszeit_stunden);
    document.getElementById('out-brutto-verdienst').textContent = formatCHF(data.brutto_verdienst_chf);

    const ahvRow = document.getElementById('row-ahv');
    const alvRow = document.getElementById('row-alv');
    const nettoRow = document.getElementById('row-netto');
    if (data.ahv_iv_eo_abzug === null || data.ahv_iv_eo_abzug === undefined) {
      ahvRow.style.display = 'none';
      alvRow.style.display = 'none';
      nettoRow.style.display = 'none';
    } else {
      ahvRow.style.display = '';
      alvRow.style.display = '';
      nettoRow.style.display = '';
      document.getElementById('out-ahv').textContent = `– ${formatCHF(data.ahv_iv_eo_abzug)}`;
      document.getElementById('out-alv').textContent = `– ${formatCHF(data.alv_abzug)}`;
      document.getElementById('out-netto').textContent = formatCHF(data.netto_verdienst_chf);
    }

    const verbleibendEl = document.getElementById('out-verbleibend');
    if (data.verbleibende_stunden_monat === null || data.verbleibende_stunden_monat === undefined) {
      verbleibendEl.textContent = '– (kein Monats-Soll angegeben)';
    } else {
      verbleibendEl.textContent = formatStunden(data.verbleibende_stunden_monat);
    }

    jsonBlock.hidden = false;
    outJson.textContent = JSON.stringify(data, null, 2);

    resultEmpty.hidden = true;
    resultBody.hidden = false;
    resultEl.classList.remove('reveal');
    void resultEl.offsetWidth;
    resultEl.classList.add('reveal');
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    hideError();

    const payload = {
      arbeitgeber: form.arbeitgeber.value.trim(),
      startzeit: form.startzeit.value,
      endzeit: form.endzeit.value,
      pausenzeit_total_minuten: Number(form.pausenzeit_total_minuten.value),
      stundenlohn_chf: Number(form.stundenlohn_chf.value),
    };

    if (trackMonat.checked) {
      payload.monat_soll_stunden = Number(form.monat_soll_stunden.value);
      payload.bereits_geleistete_stunden = Number(form.bereits_geleistete_stunden.value);
    }

    payload.sozialabzuege_berechnen = trackSozial.checked;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Berechne …';

    try {
      const response = await fetch('/arbeitszeitcheck', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await response.json();
      if (!response.ok) {
        throw new Error(extractErrorMessage(data));
      }
      renderResult(data);
    } catch (err) {
      if (err instanceof TypeError) {
        showError('Server nicht erreichbar. Läuft dein FastAPI-Server?');
      } else {
        showError(err.message);
      }
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Berechnen';
    }
  });

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(outJson.textContent);
      copyBtn.textContent = 'Kopiert ✓';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = 'Kopieren';
        copyBtn.classList.remove('copied');
      }, 1500);
    } catch {
      copyBtn.textContent = 'Fehler beim Kopieren';
    }
  });

  verlaufBtn.addEventListener('click', async () => {
    if (!lastResult) {
      showError('Bitte zuerst eine Berechnung durchführen, bevor du den Verlauf ergänzt.');
      return;
    }
    const werte = sammleVerlaufWerte();
    try {
      await verlaufErgaenzenUndHerunterladen(verlaufDatei.files[0], VERLAUF_SPALTEN, werte);
    } catch (err) {
      showError('Die Datei konnte nicht gelesen werden. Ist es wirklich eine gültige .csv- oder .xlsx-Datei?');
    }
  });
</script>
</body>

<style>
  :root {
    --paper: #eef2ea;
    --rule: #c7d0c0;
    --ink: #1e2b22;
    --ink-soft: #5b6b5c;
    --surface: #fbfaf4;
    --accent: #2f6b4a;
    --accent-dark: #234f37;
    --accent-contrast: #f3f7f0;
    --money: #96712c;
    --money-bg: #f4ead2;
    --error: #9c3b2e;
    --error-bg: #f6e6e1;
    --font-serif: 'Iowan Old Style', 'Palatino Linotype', Georgia, 'Times New Roman', serif;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background-color: var(--paper);
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 27px,
      var(--rule) 27px,
      var(--rule) 28px
    );
    color: var(--ink);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 960px;
    margin: 0 auto;
    padding: 3rem 1.5rem 5rem;
  }

  .masthead { margin-bottom: 2.5rem; }

  .masthead h1 {
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: clamp(1.75rem, 1.3rem + 1.6vw, 2.5rem);
    margin: 0 0 0.35rem;
  }

  .masthead p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 1rem;
  }

  .ledger {
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 2.5rem;
    align-items: start;
  }

  @media (max-width: 760px) {
    .ledger { grid-template-columns: 1fr; }
  }

  .entry {
    background: var(--surface);
    border-top: 3px solid var(--ink);
    padding: 2rem;
  }

  .field { margin-bottom: 1.4rem; }

  .field label {
    display: block;
    font-family: var(--font-serif);
    font-size: 0.95rem;
    color: var(--ink-soft);
    margin-bottom: 0.4rem;
  }

  .field input {
    width: 100%;
    border: none;
    border-bottom: 1.5px solid var(--rule);
    background: transparent;
    padding: 0.5rem 0.1rem;
    font: 1rem/1.4 var(--font-sans);
    color: var(--ink);
  }

  .field input:focus-visible {
    outline: none;
    border-bottom-color: var(--accent);
    box-shadow: 0 1px 0 0 var(--accent);
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
  }

  @media (max-width: 480px) {
    .row { grid-template-columns: 1fr; }
  }

  .toggle {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin: 1.6rem 0 1rem;
    font-family: var(--font-serif);
    color: var(--ink-soft);
  }

  .toggle input { width: auto; }

  .sub-fields {
    border-left: 2px solid var(--rule);
    padding-left: 1.25rem;
    margin-bottom: 1.4rem;
  }

  button[type="submit"] {
    background: var(--accent);
    color: var(--accent-contrast);
    border: none;
    border-radius: 2px;
    padding: 0.85rem 1.9rem;
    font: 600 1rem var(--font-sans);
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }

  button[type="submit"]:hover { background: var(--accent-dark); }
  button[type="submit"]:active { transform: translateY(1px); }
  button[type="submit"]:disabled { opacity: 0.6; cursor: progress; }

  .error {
    background: var(--error-bg);
    color: var(--error);
    border-left: 3px solid var(--error);
    padding: 0.75rem 1rem;
    font-size: 0.9rem;
    border-radius: 2px;
    margin-top: 1.25rem;
  }

  .stub {
    background: var(--surface);
    border-top: 3px solid var(--money);
    padding: 2rem;
  }

  .stub h2 {
    font-family: var(--font-serif);
    font-size: 1.3rem;
    margin: 0 0 1.25rem;
  }

  .stub-empty {
    color: var(--ink-soft);
    font-size: 0.95rem;
    line-height: 1.5;
  }

  .stub-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.75rem;
    padding: 0.65rem 0;
    border-bottom: 1px dashed var(--rule);
    font-family: var(--font-mono);
    font-size: 0.95rem;
  }

  .stub-row[hidden] {
    display: none;
  }

  .stub-row:last-child { border-bottom: none; }

  .stub-row .label {
    font-family: var(--font-sans);
    color: var(--ink-soft);
  }

  .stub-row .value {
    text-align: right;
  }

  .stub-row.money .value {
    color: var(--money);
    font-weight: 700;
    background: var(--money-bg);
    padding: 0.15rem 0.45rem;
    border-radius: 2px;
  }

  .json-block {
    margin-top: 1rem;
    font-family: var(--font-sans);
  }

  .json-block summary {
    cursor: pointer;
    font-family: var(--font-serif);
    color: var(--ink-soft);
    margin-bottom: 0.4rem;
  }

  .json-block pre {
    margin: 0 0 0.5rem;
    padding: 0.75rem;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 2px;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    line-height: 1.4;
    color: var(--ink);
    overflow-x: auto;
    white-space: pre;
    max-height: 200px;
  }

  .copy-btn {
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    font: 600 0.8rem var(--font-sans);
    padding: 0.4rem 0.9rem;
    border-radius: 2px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  /* Kompaktere Gestaltung des Verlauf-Bereichs */
  .verlauf-aktion {
    margin-top: 0.85rem;
    padding: 0.65rem 0.85rem;
    border: 1px solid var(--rule);
    border-radius: 2px;
    background: var(--paper);
  }

  .verlauf-aktion .field {
    margin-bottom: 0.4rem;
  }

  .verlauf-aktion .field label {
    font-size: 0.82rem;
    margin-bottom: 0.2rem;
  }

  .verlauf-aktion .field input[type="file"] {
    font-size: 0.8rem;
    padding: 0.1rem 0;
  }

  .verlauf-aktion #verlauf-btn {
    margin-top: 0.2rem;
    width: 100%;
    padding: 0.35rem 0.6rem;
    font-size: 0.78rem;
    line-height: 1.25;
  }

  .copy-btn:hover,
  .copy-btn.copied {
    border-color: var(--accent);
    color: var(--accent);
  }

  @keyframes reveal {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .stub.reveal .stub-body { animation: reveal 0.35s ease; }

  @media (prefers-reduced-motion: reduce) {
    .stub.reveal .stub-body { animation: none; }
  }
</style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <h1>Stundenzettel</h1>
      <p>Arbeitszeit &amp; Lohn für mehrere Arbeitgeber</p>
    </header>

    <main class="ledger">
      <form id="calc-form" class="entry">
        <div class="field">
          <label for="arbeitgeber">Arbeitgeber</label>
          <input type="text" id="arbeitgeber" name="arbeitgeber" placeholder="z. B. Bäckerei Meier" required />
        </div>

        <div class="row">
          <div class="field">
            <label for="startzeit">Start</label>
            <input type="datetime-local" id="startzeit" name="startzeit" required />
          </div>
          <div class="field">
            <label for="endzeit">Ende</label>
            <input type="datetime-local" id="endzeit" name="endzeit" required />
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="pausenzeit_total_minuten">Pausenzeit (Minuten)</label>
            <input type="number" id="pausenzeit_total_minuten" name="pausenzeit_total_minuten" min="0" step="any" value="0" required />
          </div>
          <div class="field">
            <label for="stundenlohn_chf">Stundenlohn (CHF)</label>
            <input type="number" id="stundenlohn_chf" name="stundenlohn_chf" min="0" step="any" required />
          </div>
        </div>

        <label class="toggle">
          <input type="checkbox" id="track-monat" />
          Monats-Soll verfolgen
        </label>

        <div class="sub-fields" id="monat-fields" hidden>
          <div class="field">
            <label for="monat_soll_stunden">Soll-Stunden diesen Monat</label>
            <input type="number" id="monat_soll_stunden" name="monat_soll_stunden" min="0" step="any" />
          </div>
          <div class="field">
            <label for="bereits_geleistete_stunden">Bereits geleistete Stunden</label>
            <input type="number" id="bereits_geleistete_stunden" name="bereits_geleistete_stunden" min="0" step="any" />
          </div>
        </div>

        <label class="toggle">
          <input type="checkbox" id="track-sozialabzuege" />
          Sozialabzüge berechnen
        </label>

        <button type="submit" id="submit-btn">Berechnen</button>

        <div class="error" id="error-box" role="alert" aria-live="polite" hidden></div>
      </form>

      <aside class="stub" id="result">
        <h2>Ergebnis</h2>
        <p class="stub-empty" id="result-empty">
          Noch keine Berechnung. Trag deine Schicht links ein und klick auf „Berechnen“.
        </p>
        <div class="stub-body" id="result-body" hidden aria-live="polite">
          <div class="stub-row">
            <span class="label">Arbeitgeber</span>
            <span class="value" id="out-arbeitgeber"></span>
          </div>
          <div class="stub-row">
            <span class="label">Datum</span>
            <span class="value" id="out-datum"></span>
          </div>
          <div class="stub-row">
            <span class="label">Wochentag</span>
            <span class="value" id="out-wochentag"></span>
          </div>
          <div class="stub-row">
            <span class="label">Arbeitszeit</span>
            <span class="value" id="out-arbeitszeit"></span>
          </div>
          <div class="stub-row money">
            <span class="label">Brutto-Verdienst</span>
            <span class="value" id="out-brutto-verdienst"></span>
          </div>
          <div class="stub-row" id="row-ahv">
            <span class="label">AHV/IV/EO-Abzug</span>
            <span class="value" id="out-ahv"></span>
          </div>
          <div class="stub-row" id="row-alv">
            <span class="label">ALV-Abzug</span>
            <span class="value" id="out-alv"></span>
          </div>
          <div class="stub-row money" id="row-netto">
            <span class="label">Netto-Verdienst</span>
            <span class="value" id="out-netto"></span>
          </div>
          <div class="stub-row">
            <span class="label">Verbleibend bis Monats-Soll</span>
            <span class="value" id="out-verbleibend"></span>
          </div>
        </div>

        <div class="verlauf-aktion">
          <div class="field">
            <label for="verlauf-datei">Bisherigen Stundenzettel hinzufügen (optional)</label>
            <input type="file" id="verlauf-datei" name="verlauf-datei" accept=".csv,.xlsx" />
          </div>
          <button type="button" id="verlauf-btn" class="copy-btn">Neuen Stundenzettel herunterladen</button>
        </div>

        <details class="json-block" id="json-block" hidden open>
          <summary>JSON-Antwort</summary>
          <pre><code id="out-json"></code></pre>
          <button type="button" id="copy-json-btn" class="copy-btn">Kopieren</button>
        </details>
      </aside>
    </main>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  const form = document.getElementById('calc-form');
  const trackMonat = document.getElementById('track-monat');
  const monatFields = document.getElementById('monat-fields');
  const trackSozial = document.getElementById('track-sozialabzuege');
  const submitBtn = document.getElementById('submit-btn');
  const errorBox = document.getElementById('error-box');
  const resultEl = document.getElementById('result');
  const resultEmpty = document.getElementById('result-empty');
  const resultBody = document.getElementById('result-body');
  const jsonBlock = document.getElementById('json-block');
  const outJson = document.getElementById('out-json');
  const copyBtn = document.getElementById('copy-json-btn');
  const verlaufBtn = document.getElementById('verlauf-btn');
  const verlaufDatei = document.getElementById('verlauf-datei');
  let lastResult = null;

  trackMonat.addEventListener('change', () => {
    const checked = trackMonat.checked;
    monatFields.hidden = !checked;
    form.monat_soll_stunden.required = checked;
    form.bereits_geleistete_stunden.required = checked;
    if (!checked) {
      form.monat_soll_stunden.value = '';
      form.bereits_geleistete_stunden.value = '';
    }
  });

  function hideError() {
    errorBox.hidden = true;
    errorBox.textContent = '';
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.hidden = false;
  }

  function extractErrorMessage(data) {
    if (typeof data.detail === 'string') return data.detail;
    if (Array.isArray(data.detail)) {
      return data.detail.map((d) => d.msg || JSON.stringify(d)).join('; ');
    }
    return 'Unbekannter Fehler.';
  }

  function formatDatum(iso) {
    const [y, m, d] = iso.split('-');
    return `${d}.${m}.${y}`;
  }

  const LOHN_ZUSCHLAG = 1.25;

  function formatWochentag(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    const datum = new Date(y, m - 1, d);
    const name = datum.toLocaleDateString('de-CH', { weekday: 'long' });
    const tag = datum.getDay();
    if (tag === 0 || tag === 6) {
      const prozent = Math.round(LOHN_ZUSCHLAG * 100);
      return `${name} (Lohnzuschlag von ${prozent}%)`;
    }
    return name;
  }

  function formatStunden(value) {
    return `${Number(value).toFixed(2)} h`;
  }

  function formatCHF(value) {
    return `CHF ${Number(value).toFixed(2)}`;
  }

  const VERLAUF_SPALTEN = [
    'arbeitgeber', 'datum', 'arbeitszeit_stunden', 'bereits_geleistete_stunden',
    'verbleibende_stunden_monat', 'brutto_verdienst_chf',
    'ahv_iv_eo_abzug', 'alv_abzug', 'netto_verdienst_chf',
  ];

  function csvEscape(wert) {
    const text = String(wert ?? '');
    if (/[",\n]/.test(text)) {
      return `"${text.replace(/"/g, '""')}"`;
    }
    return text;
  }

  function sammleVerlaufWerte() {
    const ergebnis = lastResult || {};
    return {
      arbeitgeber: form.arbeitgeber.value,
      datum: ergebnis.datum,
      arbeitszeit_stunden: ergebnis.arbeitszeit_stunden,
      bereits_geleistete_stunden: trackMonat.checked ? Number(form.bereits_geleistete_stunden.value) : '',
      verbleibende_stunden_monat: ergebnis.verbleibende_stunden_monat,
      brutto_verdienst_chf: ergebnis.brutto_verdienst_chf,
      ahv_iv_eo_abzug: ergebnis.ahv_iv_eo_abzug,
      alv_abzug: ergebnis.alv_abzug,
      netto_verdienst_chf: ergebnis.netto_verdienst_chf,
    };
  }

  async function verlaufErgaenzenUndHerunterladen(datei, spalten, werte) {
    const istExcel = datei && datei.name.toLowerCase().endsWith('.xlsx');

    if (istExcel) {
      const buffer = await datei.arrayBuffer();
      const workbook = XLSX.read(buffer, { type: 'array' });
      const blattName = workbook.SheetNames[0];
      const blatt = workbook.Sheets[blattName];
      const zeilen = XLSX.utils.sheet_to_json(blatt, { header: 1, defval: '' });

      while (
        zeilen.length > 0 &&
        zeilen[zeilen.length - 1].every((zelle) => zelle === '' || zelle === undefined || zelle === null)
      ) {
        zeilen.pop();
      }

      zeilen.push(spalten.map((spalte) => werte[spalte] ?? ''));

      const neuesBlatt = XLSX.utils.aoa_to_sheet(zeilen);
      const neuesWorkbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(neuesWorkbook, neuesBlatt, blattName || 'Verlauf');
      XLSX.writeFile(neuesWorkbook, datei.name);
      return;
    }

    const neueZeile = spalten.map((spalte) => csvEscape(werte[spalte])).join(',');
    if (datei) {
      const reader = new FileReader();
      reader.onload = () => {
        let inhalt = reader.result.replace(/\r\n/g, '\n').trimEnd();
        inhalt += '\n' + neueZeile + '\n';
        ladeCsvHerunter(inhalt, datei.name);
      };
      reader.readAsText(datei);
    } else {
      const kopfzeile = spalten.join(',');
      ladeCsvHerunter(kopfzeile + '\n' + neueZeile + '\n', 'verlauf.csv');
    }
  }

  function ladeCsvHerunter(inhalt, dateiname = 'verlauf.csv') {
    const blob = new Blob([inhalt], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = dateiname;
    link.click();
    URL.revokeObjectURL(url);
  }

  function renderResult(data) {
    lastResult = data;
    document.getElementById('out-arbeitgeber').textContent = data.arbeitgeber;
    document.getElementById('out-datum').textContent = formatDatum(data.datum);
    document.getElementById('out-wochentag').textContent = formatWochentag(data.datum);
    document.getElementById('out-arbeitszeit').textContent = formatStunden(data.arbeitszeit_stunden);
    document.getElementById('out-brutto-verdienst').textContent = formatCHF(data.brutto_verdienst_chf);

    const ahvRow = document.getElementById('row-ahv');
    const alvRow = document.getElementById('row-alv');
    const nettoRow = document.getElementById('row-netto');
    if (data.ahv_iv_eo_abzug === null || data.ahv_iv_eo_abzug === undefined) {
      ahvRow.style.display = 'none';
      alvRow.style.display = 'none';
      nettoRow.style.display = 'none';
    } else {
      ahvRow.style.display = '';
      alvRow.style.display = '';
      nettoRow.style.display = '';
      document.getElementById('out-ahv').textContent = `– ${formatCHF(data.ahv_iv_eo_abzug)}`;
      document.getElementById('out-alv').textContent = `– ${formatCHF(data.alv_abzug)}`;
      document.getElementById('out-netto').textContent = formatCHF(data.netto_verdienst_chf);
    }

    const verbleibendEl = document.getElementById('out-verbleibend');
    if (data.verbleibende_stunden_monat === null || data.verbleibende_stunden_monat === undefined) {
      verbleibendEl.textContent = '– (kein Monats-Soll angegeben)';
    } else {
      verbleibendEl.textContent = formatStunden(data.verbleibende_stunden_monat);
    }

    jsonBlock.hidden = false;
    outJson.textContent = JSON.stringify(data, null, 2);

    resultEmpty.hidden = true;
    resultBody.hidden = false;
    resultEl.classList.remove('reveal');
    void resultEl.offsetWidth;
    resultEl.classList.add('reveal');
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    hideError();

    const payload = {
      arbeitgeber: form.arbeitgeber.value.trim(),
      startzeit: form.startzeit.value,
      endzeit: form.endzeit.value,
      pausenzeit_total_minuten: Number(form.pausenzeit_total_minuten.value),
      stundenlohn_chf: Number(form.stundenlohn_chf.value),
    };

    if (trackMonat.checked) {
      payload.monat_soll_stunden = Number(form.monat_soll_stunden.value);
      payload.bereits_geleistete_stunden = Number(form.bereits_geleistete_stunden.value);
    }

    payload.sozialabzuege_berechnen = trackSozial.checked;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Berechne …';

    try {
      const response = await fetch('/arbeitszeitcheck', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await response.json();
      if (!response.ok) {
        throw new Error(extractErrorMessage(data));
      }
      renderResult(data);
    } catch (err) {
      if (err instanceof TypeError) {
        showError('Server nicht erreichbar. Läuft dein FastAPI-Server?');
      } else {
        showError(err.message);
      }
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Berechnen';
    }
  });

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(outJson.textContent);
      copyBtn.textContent = 'Kopiert ✓';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = 'Kopieren';
        copyBtn.classList.remove('copied');
      }, 1500);
    } catch {
      copyBtn.textContent = 'Fehler beim Kopieren';
    }
  });

  verlaufBtn.addEventListener('click', async () => {
    if (!lastResult) {
      showError('Bitte zuerst eine Berechnung durchführen, bevor du den Verlauf ergänzt.');
      return;
    }
    const werte = sammleVerlaufWerte();
    try {
      await verlaufErgaenzenUndHerunterladen(verlaufDatei.files[0], VERLAUF_SPALTEN, werte);
    } catch (err) {
      showError('Die Datei konnte nicht gelesen werden. Ist es wirklich eine gültige .csv- oder .xlsx-Datei?');
    }
  });
</script>
</body>
</html>
